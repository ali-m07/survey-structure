name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    needs: security-scan
    strategy:
      matrix:
        service:
          - identity-service
          - organization-service
          - survey-engine-service
          - ai-ml-service
          - action-planner-service
          - reporting-service
          - workflow-automation-service
          - integration-marketplace-service
          - notification-service
          - performance-service
          - feedback-service
          - blockchain-service
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:latest ./services/${{ matrix.service }}
      - name: Run tests
        run: |
          docker run --rm ${{ matrix.service }}:latest pytest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/deployments/staging/
          kubectl rollout status deployment/${{ matrix.service }} -n staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to production
        run: |
          helm upgrade --install ex-platform ./k8s/charts --namespace ex-platform
          kubectl rollout status deployment/${{ matrix.service }} -n ex-platform

