apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ex-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/ex-platform-project.git
    targetRevision: main
    path: k8s/charts
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ex-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

