# Global values
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# PostgreSQL
postgresql:
  enabled: true
  auth:
    postgresPassword: "changeme"
    database: "ex_platform_db"
  primary:
    persistence:
      enabled: true
      size: 50Gi

# Redis
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 10Gi

# RabbitMQ
rabbitmq:
  enabled: true
  auth:
    username: guest
    password: guest
  persistence:
    enabled: true
    size: 20Gi

# Kafka
kafka:
  enabled: true
  persistence:
    enabled: true
    size: 50Gi
  zookeeper:
    persistence:
      enabled: true
      size: 20Gi

# Neo4j
neo4j:
  enabled: true
  auth:
    neo4j:
      password: "changeme"
  core:
    persistentVolume:
      size: 50Gi

# Prometheus
prometheus:
  enabled: true
  server:
    persistentVolume:
      enabled: true
      size: 50Gi

# Grafana
grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  persistence:
    enabled: true
    size: 10Gi

# Jaeger
jaeger:
  enabled: true
  storage:
    type: elasticsearch
    elasticsearch:
      nodeCount: 1

# Loki
loki:
  enabled: true
  persistence:
    enabled: true
    size: 50Gi

# Vault
vault:
  enabled: true
  server:
    dev:
      enabled: true

# Traefik
traefik:
  enabled: true
  ingressRoute:
    dashboard:
      enabled: true

# Identity Service
identityService:
  enabled: true
  image:
    repository: ex-platform/identity-service
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8000
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    - name: DATABASE_HOST
      value: "postgresql"
    - name: DATABASE_NAME
      value: "ex_platform_db"
    - name: DATABASE_USER
      value: "postgres"
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgresql
          key: postgres-password

