{{- if .Values.identityService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ex-platform.labels" . | nindent 4 }}
    app: identity-service
spec:
  replicas: {{ .Values.identityService.replicaCount }}
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        {{- include "ex-platform.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: identity-service
        image: "{{ .Values.identityService.image.repository }}:{{ .Values.identityService.image.tag }}"
        imagePullPolicy: {{ .Values.identityService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATABASE_HOST
          value: "postgresql"
        - name: DATABASE_NAME
          value: "ex_platform_db"
        - name: DATABASE_USER
          value: "postgres"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: postgres-password
        - name: REDIS_HOST
          value: "redis"
        resources:
          {{- toYaml .Values.identityService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: identity-service
spec:
  type: {{ .Values.identityService.service.type }}
  ports:
    - port: {{ .Values.identityService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: identity-service
---
{{- if .Values.identityService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-service
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-service
  minReplicas: {{ .Values.identityService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.identityService.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.identityService.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
{{- end }}
{{- end }}

