apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ex-platform-ingress
  namespace: ex-platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: default-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.example.com
        - app.example.com
      secretName: ex-platform-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /api/v1/identity
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 8000
          - path: /api/v1/organization
            pathType: Prefix
            backend:
              service:
                name: organization-service
                port:
                  number: 8000
          - path: /api/v1/survey
            pathType: Prefix
            backend:
              service:
                name: survey-engine-service
                port:
                  number: 8000
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: ai-ml-service
                port:
                  number: 8000
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

