[tool.poetry]
name = "ai-ml-service"
version = "0.1.0"
description = "AI/ML service with Ollama, multimodal AI, and predictive models"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104"
uvicorn = "^0.24"
requests = "^2.31"
numpy = "^1.24"
scikit-learn = "^1.3"
python-decouple = "^3.8"
pydantic = "^2.5"
pillow = "^10.1"
joblib = "^1.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

