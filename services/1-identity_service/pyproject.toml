[tool.poetry]
name = "identity-service"
version = "0.1.0"
description = "Identity and Authentication Service with SSO, MFA, and zero-trust security"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
Django = "^4.2"
djangorestframework = "^3.14"
django-cors-headers = "^4.0"
psycopg2-binary = "^2.9"
redis = "^4.5"
celery = "^5.3"
django-tenant-schemas = "^1.10"
dj-rest-auth = "^5.0"
django-allauth = "^0.52"
cryptography = "^41.0"
pyjwt = "^2.8"
python-decouple = "^3.8"
prometheus-client = "^0.18"
opentelemetry-api = "^1.19"
opentelemetry-sdk = "^1.19"
opentelemetry-instrumentation-django = "^0.41"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-django = "^4.5"
black = "^23.7"
flake8 = "^6.1"
mypy = "^1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

