name: Survey platform checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    paths:
      - 'frontend/**'
      - 'services/3-survey_engine_service/**'
      - 'deployment/**'
      - 'docker-compose.survey.yml'
      - '.github/workflows/survey-platform.yml'

permissions:
  contents: read

jobs:
  survey-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/3-survey_engine_service
    env:
      USE_SQLITE: 'True'
      DEBUG: 'True'
      SECRET_KEY: 'ci-only-survey-key-not-for-deployment'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/3-survey_engine_service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test app.surveys

  survey-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
