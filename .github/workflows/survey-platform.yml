name: Survey platform checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    paths:
      - 'frontend/**'
      - 'services/3-survey_engine_service/**'
      - 'deployment/**'
      - 'scripts/run-tests.py'
      - 'scripts/test.ps1'
      - 'docker-compose.yml'
      - '.github/workflows/survey-platform.yml'

permissions:
  contents: read

jobs:
  survey-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/3-survey_engine_service
    env:
      USE_SQLITE: 'True'
      DEBUG: 'True'
      SECRET_KEY: 'ci-only-survey-key-not-for-deployment'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/3-survey_engine_service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python ../../scripts/run-tests.py --suite backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/backend

  survey-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ../scripts/run-tests.py --suite frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: test-results/frontend
